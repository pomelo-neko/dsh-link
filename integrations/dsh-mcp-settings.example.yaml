# dsh-link as a native DSH tool set (via @deepseek-ai/dsh-mcp-client).
#
# One entry per machine: it points at the LOCAL dshlink node, and peers are reached
# by name through the "peer" argument, so N machines need N entries total (not N^2).
#
# Tool names become: mcp__dshlink__link_status, mcp__dshlink__link_send_message, ...

- id: mcp-dshlink
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: dshlink
    transport: streamable-http
    url: http://127.0.0.1:8787/mcp
    toolCallTimeoutMs: 120000
    # Optional when auth.trustLocalhost is false (create with: dshlink token new --label dsh):
    # headers:
    #   Authorization: !!js '`Bearer ${process.env.DSHLINK_TOKEN}`'
